services:
  postgres:
    image: postgres:18
    container_name: project-manage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - project_manage_postgres:/var/lib/postgresql/data

volumes:
  project_manage_postgres:

